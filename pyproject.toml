[project]
name = "rag-system-2026"
version = "0.1.0"
description = "Production RAG system over ML papers"
authors = [
    {name = "shruti32", email = "shruti.agrawal92@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "qdrant-client>=1.9.0,<2.0.0",
    "sentence-transformers>=3.0.0",
    "langchain-text-splitters>=0.2.0",
    "pypdf>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[tool.poetry]
packages = [{include = "src"}]

[tool.pytest.ini_options]
asyncio_mode = "auto"
